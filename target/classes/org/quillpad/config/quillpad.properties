# ============================================================================
# QuillPad Application Configuration
# ============================================================================
# This file contains all application settings for QuillPad.
# Edit these values to customize the editor behavior.
# ============================================================================

# ----------------------------------------------------------------------------
# Application Settings
# ----------------------------------------------------------------------------

# Application name
app.name=QuillPad

# Application version (auto-generated)
app.version=1.0.0-SNAPSHOT

# Application build number
app.build=1

# Application vendor/author
app.vendor=QuillPad Team

# Application description
app.description=A modern, feature-rich code editor for developers

# Application homepage URL
app.homepage=https://quillpad.io

# Application update URL
app.update.url=https://update.quillpad.io

# Application support URL
app.support.url=https://quillpad.io/support

# Application license
app.license=MIT

# Application license URL
app.license.url=https://opensource.org/licenses/MIT

# Enable automatic update checking
app.update.enabled=true

# Automatic update check interval in hours
app.update.check.interval=24

# Enable beta updates
app.update.beta=false

# ----------------------------------------------------------------------------
# Window Settings
# ----------------------------------------------------------------------------

# Default window width in pixels
window.width=1280

# Default window height in pixels
window.height=800

# Minimum window width in pixels
window.min.width=640

# Minimum window height in pixels
window.min.height=480

# Default window state (NORMAL, MAXIMIZED, FULLSCREEN)
window.state=NORMAL

# Enable window restore on startup
window.restore=true

# Remember window position and size
window.remember.position=true

# Window icon path (relative to resources)
window.icon=icons/quillpad.png

# Window title pattern
window.title.pattern={appName} - {fileName}{dirty}{separator}{folderName}

# Enable smooth window transitions
window.transitions=true

# Menu bar visibility
window.menu.bar.visible=true

# Status bar visibility
window.status.bar.visible=true

# Activity bar visibility
window.activity.bar.visible=true

# Sidebar visibility
window.sidebar.visible=true

# Default sidebar position (LEFT, RIGHT)
window.sidebar.position=LEFT

# Default sidebar width in pixels
window.sidebar.width=250

# Default panel position (BOTTOM, LEFT, RIGHT)
window.panel.position=BOTTOM

# Default panel height in pixels
window.panel.height=200

# Tab bar position (TOP, BOTTOM)
window.tab.bar.position=TOP

# Tab close button behavior (SINGLE, DOUBLE, HOVER)
window.tab.close.behavior=HOVER

# Enable tabs on top of editor
window.tabs.on.top=true

# ----------------------------------------------------------------------------
# Editor Settings
# ----------------------------------------------------------------------------

# Default font family for editor
editor.font.family=Consolas, Monaco, 'Courier New', monospace

# Default font size in pixels
editor.font.size=14

# Default line height (multiplier)
editor.line.height=1.5

# Enable font ligatures
editor.font.ligatures=false

# Default tab size
editor.tab.size=4

# Convert tabs to spaces
editor.tab.to.spaces=true

# Insert spaces when pressing Tab
editor.insert.spaces.on.tab=true

# Enable bracket pair colorization
editor.bracket.pair.colorization=true

# Enable bracket pair guides
editor.bracket.pair.guides=false

# Render whitespace (NONE, BOUNDARY, ALL, SELECTION)
editor.render.whitespace=SELECTION

# Render control characters
editor.render.controls=false

# Render line breaks
editor.render.line.breaks=false

# Word wrap mode (NONE, WORD, CHARACTER, ADVANCED)
editor.word.wrap=NONE

# Enable word wrap for specific languages
editor.word.wrap.languages=markdown,plaintext

# Line numbers visibility (NONE, RELATIVE, ABSOLUTE)
editor.line.numbers=ABSOLUTE

# Current line highlight visibility
editor.highlight.current.line=true

# Current line highlight color
editor.highlight.current.line.color=#2D2D2D

# Cursor blink interval in milliseconds
editor.cursor.blink.interval=500

# Cursor style (BLOCK, LINE, UNDERLINE)
editor.cursor.style=LINE

# Enable cursor smooth animation
editor.cursor.smooth.caret.animation=false

# Enable select bracket when cursor is on bracket
editor.select.bracket=true

# Enable quick suggestions
editor.quick.suggestions=true

# Quick suggestion delay in milliseconds
editor.quick.suggestions.delay=10

# Enable parameter hints
editor.parameter.hints.enabled=true

# Enable auto closing brackets
editor.auto.closing.brackets=true

# Enable auto closing quotes
editor.auto.closing.quotes=true

# Enable auto surrounding pairs
editor.auto.surrounding.pairs=true

# Enable auto indent on new line
editor.auto.indent=true

# Enable auto indentation based on language
editor.auto.indent.mode=LANGUAGE

# Trim trailing whitespace on save
editor.trim.trailing.whitespace=true

# Ensure final newline on save
editor.final.newline=true

# Detect indentation from content
editor.detect.indent.from.content=true

# Default end of line (LF, CRLF, CR, AUTO)
editor.eol=AUTO

# Enable sticky scroll
editor.sticky.scroll=true

# Sticky scroll maximum lines
editor.sticky.scroll.max.lines=5

# Enable smooth scrolling
editor.smooth.scrolling=true

# Scroll sensitivity
editor.scroll.sensitivity=1.0

# Enable mouse wheel zoom
editor.mouse.wheel.zoom=true

# Mouse wheel zoom sensitivity
editor.mouse.wheel.zoom.sensitivity=0.1

# Enable multi cursor modifier (ALT, CTRL)
editor.multi.cursor.modifier=ALT

# Enable auto save
editor.auto.save.enabled=true

# Auto save delay in milliseconds
editor.auto.save.delay=1000

# Auto save when window loses focus
editor.auto.save.on.focus.change=false

# Auto save when application is hidden
editor.auto.save.on.application.hide=true

# ----------------------------------------------------------------------------
# Minimap Settings
# ----------------------------------------------------------------------------

# Enable minimap visibility
minimap.enabled=true

# Minimap position (LEFT, RIGHT)
minimap.position=RIGHT

# Minimap default scale
minimap.scale=1

# Minimap max scale
minimap.scale.max=3

# Minimap min scale
minimap.scale.min=0.5

# Minimap show slider (ALWAYS, MOUSE_OVER, NEVER)
minimap.show.slider=MOUSE_OVER

# Minimap render characters
minimap.render.characters=false

# Minimap highlight selected line
minimap.highlight.selected.line=true

# ----------------------------------------------------------------------------
# Gutter Settings
# ----------------------------------------------------------------------------

# Gutter line numbers visibility
gutter.line.numbers=true

# Gutter line numbers min digits
gutter.line.numbers.min.digits=3

# Gutter code lens visibility
gutter.code.lens=true

# Gutter fold visibility
gutter.fold=true

# Gutter fold style (CIRCLE, TRIANGLE, CODERAY)
gutter.fold.style=TRIANGLE

# Gutter breakpoint visibility
gutter.breakpoints=true

# Gutter error markers visibility
gutter.error.markers=true

# Gutter git decorations visibility
gutter.git.decorations=true

# Gutter indent guides visibility
gutter.indent.guides=true

# Gutter indent guides mode (NONE, REAL, LOOKING_AT)
gutter.indent.guides.mode=LOOKING_AT

# ----------------------------------------------------------------------------
# Find and Replace Settings
# ----------------------------------------------------------------------------

# Find scope (FILE, SELECTION, ALL_OPEN, WORKSPACE)
find.scope=FILE

# Enable incremental search
find.incremental=true

# Enable search in selection
find.in.selection=true

# Preserve case in replace
find.preserve.case=true

# Enable regex in search
find.regex=true

# Whole word search by default
find.whole.word=false

# Case sensitive by default
find.case.sensitive=false

# Search up direction by default
find.up.direction=false

# Wrap around search results
find.wrap.around=true

# Highlight all matches
find.highlight.all=true

# Show search count
find.show.count=true

# Show search status
find.show.status=true

# ----------------------------------------------------------------------------
# File Settings
# ----------------------------------------------------------------------------

# Default file encoding
file.encoding=UTF-8

# Auto detect file encoding
file.encoding.detect=true

# Auto guess file encoding from content
file.encoding.detect.from.content=true

# Preferred file encoding
file.encoding.preferred=UTF-8

# Enable BOM for UTF-8
file.encoding.add.bom=false

# Enable auto reload of changed files
file.auto.reload=true

# Enable auto reload on file content change
file.auto.reload.on.change=true

# Enable revert of unsaved changes
file.auto.revert=true

# Auto revert delay in milliseconds
file.auto.revert.delay=1000

# Max concurrent file watchers
file.max.watchers=10000

# Enable large file optimization
file.large.file.threshold=52428800

# Large file threshold in bytes (50MB)

# Enable read-only flag detection
file.readonly.detection=true

# Enable hidden file visibility
file.hidden.visible=false

# File exclude patterns (comma-separated globs)
file.exclude.patterns=**/.git/**,**/.svn/**,**/.hg/**,**/CVS/**,**/.DS_Store/**,**/Thumbs.db/**,**/*.class,**/*.jar,**/*.war,**/*.ear,**/*.zip,**/*.7z,**/*.tar.gz

# Enable file comparison
file.compare.enabled=true

# ----------------------------------------------------------------------------
# Recent Items Settings
# ----------------------------------------------------------------------------

# Maximum number of recent files
recent.files.max=20

# Maximum number of recent folders
recent.folders.max=10

# Maximum number of recent projects
recent.projects.max=5

# Enable clear recent items on exit
recent.clear.on.exit=false

# Remember open files between sessions
recent.remember.open.files=true

# Remember cursor position for files
recent.remember.cursor.position=true

# Maximum files to remember cursor position
recent.remember.cursor.max.files=100

# ----------------------------------------------------------------------------
# Backup and Recovery Settings
# ----------------------------------------------------------------------------

# Enable automatic backups
backup.enabled=true

# Backup directory path
backup.path=${user.home}/.quillpad/backups

# Backup interval in minutes
backup.interval=30

# Maximum backup versions per file
backup.max.versions=10

# Maximum total backup size in MB
backup.max.size=500

# Enable backup compression
backup.compress=true

# Backup file pattern
backup.file.pattern=backup_{timestamp}_{filename}

# Exclude patterns from backup (comma-separated globs)
backup.exclude.patterns=**/*.log,**/node_modules/**,**/.gradle/**,**/target/**,**/build/**

# Enable recovery on startup
recovery.enabled=true

# Recovery directory path
recovery.path=${user.home}/.quillpad/recovery

# Recovery file expiration in hours
recovery.expiration.hours=72

# Maximum recovery files
recovery.max.files=50

# Enable auto-save recovery
recovery.auto.save=true

# Auto-save recovery interval in seconds
recovery.auto.save.interval=30

# ----------------------------------------------------------------------------
# Performance Settings
# ----------------------------------------------------------------------------

# Enable hardware acceleration
performance.hardware.acceleration=true

# Enable GPU hardware acceleration
performance.gpu.hardware.acceleration=true

# GPU list (empty = auto-detect)
performance.gpu.blacklist=

# Enable smooth scrolling
performance.smooth.scrolling=true

# Animation duration in milliseconds
performance.animation.duration=200

# Maximum scroll animation duration
performance.scroll.animation.max=100

# Enable deltas file analysis
performance.delta.file.analysis=true

# Delta file analysis threshold
performance.delta.file.threshold=1000000

# Enable parallel file processing
performance.parallel.file.processing=true

# Maximum parallel file operations
performance.max.parallel.operations=4

# Enable memory optimization
performance.memory.optimization=true

# Memory limit in MB
performance.memory.limit=1024

# GC tuning enabled
performance.gc.tuning=true

# ----------------------------------------------------------------------------
# Search Settings
# ----------------------------------------------------------------------------

# Search engine (ripgrep, platinum-search)
search.engine=ripgrep

# Search result limit
search.result.limit=10000

# Search result preview lines
search.result.preview.lines=3

# Enable smart case search
search.smart.case=true

# Enable whole word search
search.whole.word=false

# Enable regex by default
search.regex=false

# Search hidden files
search.hidden.files=false

# Search symlinks
search.symlinks=true

# Exclude patterns (comma-separated globs)
search.exclude.patterns=**/.git/**,**/.svn/**,**/.hg/**,**/CVS/**,**/.DS_Store/**,**/Thumbs.db/**,node_modules/**,dist/**,build/**,target/**

# Include patterns (comma-separated globs)
search.include.patterns=**

# Enable search in files
search.in.files=true

# Search context lines
search.context.lines=2

# Search timeout in seconds
search.timeout=30

# ----------------------------------------------------------------------------
# Terminal Settings
# ----------------------------------------------------------------------------

# Integrated terminal enabled
terminal.integrated.enabled=true

# Terminal shell path
terminal.shell.linux=/bin/bash

# Terminal shell path (macOS)
terminal.shell.macos=/bin/zsh

# Terminal shell path (Windows)
terminal.shell.windows=cmd.exe

# Terminal font family
terminal.font.family=Consolas, Monaco, 'Courier New', monospace

# Terminal font size
terminal.font.size=13

# Terminal line height
terminal.line.height=1.2

# Terminal cursor style (BLOCK, LINE, UNDERLINE)
terminal.cursor.style=BLOCK

# Terminal cursor blink
terminal.cursor.blink=true

# Terminal scrollback
terminal.scrollback=10000

# Terminal bell style (NONE, VISUAL, AUDIBLE)
terminal.bell=VISUAL

# Terminal confirm on exit
terminal.confirm.on.exit=true

# Terminal working directory
terminal.working.directory=${workspace}

# Terminal env variables
terminal.env=

# Enable integrated shell environment
terminal.integrated.shell.environment=true

# Enable shell integration
terminal.shell.integration=true

# Terminal theme
terminal.theme=dark

# ----------------------------------------------------------------------------
# Theme Settings
# ----------------------------------------------------------------------------

# Current theme
theme.current=dark

# Enable automatic theme switching
theme.auto.detect=true

# Enable system theme detection
theme.system.theme=true

# Light theme
theme.light=solarizedLight

# Dark theme
theme.dark=dracula

# Enable semantic highlighting
theme.semantic.highlighting=true

# Enable syntax highlighting
theme.syntax.highlighting=true

# Enable syntax token colors override
theme.token.color.customizations={}

# Enable minimap theme color
theme.minimap.theme.colors=true

# -------------------------------------------------------------------------
# Syntax Highlighting Colors
# -------------------------------------------------------------------------

# Syntax highlighting enabled
syntax.highlighting.enabled=true

# Enable syntax error detection
syntax.error.detection=true

# Enable syntax color customization
syntax.color.customization=true

# Default syntax color theme
syntax.color.theme=default

# Enable syntax bracket matching
syntax.bracket.matching=true

# Syntax bracket matching style (BOTH, CURSOR, HIGHLIGHT)
syntax.bracket.matching.style=HIGHLIGHT

# Enable syntax inference
syntax.inference.enabled=true

# Syntax inference timeout
syntax.inference.timeout=1000

# ----------------------------------------------------------------------------
# Language Support Settings
# ----------------------------------------------------------------------------

# Enable language server protocol
lsp.enabled=true

# Language server timeout in seconds
lsp.timeout=30

# Enable auto language detection
language.auto.detection=true

# Default language mode
language.default=plaintext

# Enable format on save
language.format.on.save=false

# Format on save patterns (comma-separated globs)
language.format.on.save.patterns=**/*.java,**/*.js,**/*.ts,**/*.py,**/*.go,**/*.rs,**/*.cpp

# Enable organize imports on save
language.organize.imports.on.save=false

# Language-specific settings
language.java.home=
language.java.jdk.path=
language.python.path=
language.node.path=
language.go.path=
language.rust.path=

# ----------------------------------------------------------------------------
# Plugin Settings
# ----------------------------------------------------------------------------

# Enable plugin support
plugins.enabled=true

# Plugins directory
plugins.path=${user.home}/.quillpad/plugins

# Plugin auto-update
plugins.auto.update=true

# Plugin auto-update interval in hours
plugins.auto.update.interval=24

# Trusted plugin signatures
plugins.require.signature=true

# Disable installed plugins (comma-separated IDs)
plugins.disabled=

# Plugin market URL
plugins.market.url=https://marketplace.quillpad.io

# ----------------------------------------------------------------------------
# Telemetry Settings
# ----------------------------------------------------------------------------

# Enable telemetry
telemetry.enabled=true

# Enable crash reporting
telemetry.crash.reporting=true

# Enable error reporting
telemetry.error.reporting=true

# Enable usage statistics
telemetry.usage.statistics=true

# Enable performance data
telemetry.performance.data=true

# Enable A/B testing
telemetry.ab.testing=false

# ----------------------------------------------------------------------------
# Logging Settings
# ----------------------------------------------------------------------------

# Log level (TRACE, DEBUG, INFO, WARN, ERROR, OFF)
log.level=INFO

# Enable console logging
log.console=true

# Console log level
log.console.level=INFO

# Log file path
log.file.path=${user.home}/.quillpad/logs/quillpad.log

# Log file max size in MB
log.file.max.size=10

# Log file max history
log.file.max.history=5

# Enable log rotation
log.file.rotation=true

# Log pattern
log.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# Enable performance logging
log.performance=false

# Performance log threshold in ms
log.performance.threshold=100

# ----------------------------------------------------------------------------
# Keybinding Settings
# ----------------------------------------------------------------------------

# Keybinding profile (default, emacs, vim)
keybinding.profile=default

# Keybinding preset
keybinding.preset=default

# Enable key binding tips
keybinding.tips.visible=true

# Enable key binding reminders
keybinding.reminders=true

# Key binding reminder delay
keybinding.reminder.delay=5000

# Allow single key bindings
keybinding.allow.single=true

# Dispatch shortcut in browser
keybinding.browser.dispatch=false

# ----------------------------------------------------------------------------
# Accessibility Settings
# ----------------------------------------------------------------------------

# Enable accessibility
accessibility.enabled=true

# Screen reader optimized
accessibility.screen.reader=false

# High contrast mode
accessibility.high.contrast=false

# Cursor blink rate
accessibility.cursor.blink.rate=0

# Cursor width
accessibility.cursor.width=1

# Enable cursor animation
accessibility.cursor.animation=false

# Sticky focus
accessibility.sticky.focus=false

# Enable audio cues
accessibility.audio.cues=true

# Enable visual cues
accessibility.visual.cues=true

# Enable line cursor
accessibility.line.cursor=false

# Enable pointer size customization
accessibility.pointer.size=default

# Enable zoom customization
accessibility.zoom=default

# ----------------------------------------------------------------------------
# Network Settings
# ----------------------------------------------------------------------------

# Enable proxy support
network.proxy.enabled=false

# Proxy URL
network.proxy.url=

# Proxy username
network.proxy.username=

# Proxy password
network.proxy.password=

# Proxy exceptions
network.proxy.exceptions=localhost,127.0.0.1

# Enable strict SSL
network.ssl.strict=true

# SSL certificate path
network.ssl.cert=

# Enable HTTP/2
network.http2.enabled=true

# Connection timeout in seconds
network.connection.timeout=30

# Read timeout in seconds
network.read.timeout=60

# Write timeout in seconds
network.write.timeout=60

# Maximum connections
network.max.connections=100

# Enable conditional requests
network.conditional.requests=true

# ----------------------------------------------------------------------------
# Security Settings
# ----------------------------------------------------------------------------

# Enable sandbox mode
security.sandbox=false

# Allowed file protocols
security.allowed.protocols=file,http,https

# Enable CSP
security.csp.enabled=true

# CSP directives
security.csp.directives=default-src 'self';script-src 'self' 'unsafe-inline';style-src 'self' 'unsafe-inline';img-src 'self' data: https:;font-src 'self' data:;connect-src 'self' https://marketplace.quillpad.io;media-src 'self'

# Enable XSS protection
security.xss.protection=true

# Enable clickjacking protection
security.clickjacking.protection=true

# Enable MIME type sniffing protection
security.mime.sniffing=false

# ----------------------------------------------------------------------------
# Development Settings
# ----------------------------------------------------------------------------

# Enable developer mode
dev.mode=false

# Enable developer tools on startup
dev.tools.on.startup=false

# Enable experimental features
dev.experimental.features=false

# Developer extensions path
dev.extensions.path=

# Enable verbose logging
dev.verbose=false

# Enable performance profiler
dev.profiler=false

# Enable auto-reload
dev.auto.reload=false

# Enable source map support
dev.source.maps=true

# ----------------------------------------------------------------------------
# Internationalization Settings
# ----------------------------------------------------------------------------

# Application language
i18n.language=en

# Application locale
i18n.locale=en_US

# Enable automatic language detection
i18n.auto.detect=true

# Available languages (comma-separated)
i18n.available.languages=en,zh,ja,ko,de,fr,es,pt,ru

# Date format
i18n.date.format=yyyy-MM-dd

# Time format
i18n.time.format=HH:mm:ss

# Date time format
i18n.datetime.format=yyyy-MM-dd HH:mm:ss

# Decimal separator
i18n.decimal.separator=.

# Thousands separator
i18n.thousands.separator=,

# Currency symbol position
i18n.currency.position=before

# ----------------------------------------------------------------------------
# Default File Associations
# ----------------------------------------------------------------------------

# File extension associations (extension=language)
files.associations.java=java
files.associations.py=python
files.associations.js=javascript
files.associations.ts=typescript
files.associations.rb=ruby
files.associations.go=go
files.associations.rs=rust
files.associations.php=php
files.associations.swift=swift
files.associations.kt=kotlin
files.associations.html=html
files.associations.css=css
files.associations.scss=scss
files.associations.less=less
files.associations.json=json
files.associations.xml=xml
files.associations.yaml=yaml
files.associations.yml=yaml
files.associations.md=markdown
files.associations.markdown=markdown
files.associations.sql=sql
files.associations.sh=shell
files.associations.bash=shell
files.associations.bat=shell
files.associations.c=c
files.associations.cpp=cpp
files.associations.cc=cpp
files.associations.cxx=cpp
files.associations.h=c
files.associations.hpp=cpp

